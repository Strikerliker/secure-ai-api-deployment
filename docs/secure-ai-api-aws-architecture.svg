<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API on AWS – Implemented AWS Architecture</title>
<desc id="desc">Accurate AWS architecture for the current Secure AI API project implementation using Amazon API Gateway, a Lambda authorizer, an inference Lambda, Amazon Bedrock, AWS Secrets Manager, AWS IAM, Amazon CloudWatch, Terraform, GitHub, and GitHub Actions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a30"/><stop offset="1" stop-color="#03111f"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2945"/><stop offset="1" stop-color="#071b30"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".25"/></filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7fd0ff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f7fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#b3cee0}.h{font-weight:700}
    .cloud{fill:#08223b;stroke:#24a8f2;stroke-width:2}.zone{fill:url(#panel);stroke:#2a77a7;stroke-width:1.6}.box{fill:#0a2741;stroke:#2f6d98;stroke-width:1.4}
    .line{stroke:#7fd0ff;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke:#9bc8e8;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arr)}
    .small{font-size:13px}.tiny{font-size:11px}.cap{font-size:13px;letter-spacing:2px;fill:#6ec1ff}
  </style>
</defs>
<rect width="1600" height="900" rx="22" fill="url(#bg)"/>
<text x="800" y="49" text-anchor="middle" class="t h" font-size="40">Secure AI API on AWS – Implemented AWS Architecture</text>
<text x="800" y="82" text-anchor="middle" class="m" font-size="18">Accurate architecture for the current project implementation</text>

<g transform="translate(25 180)">
  <rect width="190" height="355" rx="16" class="zone" filter="url(#sh)"/>
  <text x="95" y="34" text-anchor="middle" class="t h" font-size="18">Client / Consumers</text>
  <rect x="30" y="70" width="130" height="225" rx="12" class="box"/>
  <path d="M58 135h74M70 97h50v30H70z" fill="none" stroke="#a9d5f5" stroke-width="3"/>
  <rect x="82" y="160" width="26" height="48" rx="4" fill="none" stroke="#a9d5f5" stroke-width="3"/>
  <text x="95" y="238" text-anchor="middle" class="t h" font-size="15">Web or Mobile App</text>
  <text x="95" y="264" text-anchor="middle" class="m small">Makes HTTPS requests</text>
  <text x="95" y="285" text-anchor="middle" class="m small">to the AI API</text>
</g>

<g transform="translate(235 125)">
  <rect width="1335" height="570" rx="20" class="cloud"/>
  <text x="28" y="36" class="cap">AWS CLOUD • CURRENT IMPLEMENTATION</text>

  <g transform="translate(30 70)">
    <rect width="285" height="250" rx="16" class="zone"/>
    <text x="142" y="34" text-anchor="middle" class="t h" font-size="19">API Entry</text>
    <rect x="83" y="62" width="120" height="120" rx="14" fill="#22194b"/>
    <rect x="111" y="82" width="64" height="64" rx="10" fill="#8C4FFF"/>
    <path d="M124 99h38v30h-38zM133 106l-6 8 6 8M153 106l6 8-6 8M143 104v20" fill="none" stroke="#fff" stroke-width="2.4"/>
    <text x="143" y="205" text-anchor="middle" class="t h" font-size="16">Amazon API Gateway</text>
    <text x="143" y="226" text-anchor="middle" class="m small">HTTPS routes • throttling • CORS</text>
  </g>

  <g transform="translate(335 70)">
    <rect width="590" height="250" rx="16" class="zone"/>
    <text x="295" y="34" text-anchor="middle" class="t h" font-size="19">Authorization &amp; Application</text>
    <g transform="translate(60 62)">
      <rect width="180" height="120" rx="14" fill="#35230c" stroke="#ff9a2e"/>
      <rect x="58" y="18" width="64" height="64" rx="10" fill="#FF9900"/>
      <path d="M73 31h14l11 37H87l-6-18-7 18H63l13-28z" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="90" y="100" text-anchor="middle" class="t h" font-size="15">Lambda Authorizer</text>
    </g>
    <g transform="translate(350 62)">
      <rect width="180" height="120" rx="14" fill="#35230c" stroke="#ff9a2e"/>
      <rect x="58" y="18" width="64" height="64" rx="10" fill="#FF9900"/>
      <path d="M73 31h14l11 37H87l-6-18-7 18H63l13-28z" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="90" y="100" text-anchor="middle" class="t h" font-size="15">Inference Lambda</text>
    </g>
    <path d="M240 122H350" class="line"/>
    <text x="295" y="111" text-anchor="middle" class="m tiny">authorized request</text>
  </g>

  <g transform="translate(945 70)">
    <rect width="360" height="250" rx="16" class="zone"/>
    <text x="180" y="34" text-anchor="middle" class="t h" font-size="19">AI Service</text>
    <rect x="112" y="62" width="136" height="120" rx="14" fill="#08363a" stroke="#21bfc1"/>
    <rect x="146" y="18" width="68" height="68" rx="11" fill="#00A9A5"/>
    <path d="M180 30c-10 0-17 8-17 18 0 6 3 11 8 14v11M180 30c10 0 17 8 17 18 0 6-3 11-8 14v11M171 46h18M171 54h18M180 30v43" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="180" y="156" text-anchor="middle" class="t h" font-size="16">Amazon Bedrock</text>
    <text x="180" y="177" text-anchor="middle" class="m small">Foundation-model inference</text>
  </g>

  <g transform="translate(115 355)">
    <rect width="300" height="170" rx="16" class="zone"/>
    <text x="150" y="32" text-anchor="middle" class="t h" font-size="18">Observability</text>
    <rect x="42" y="54" width="70" height="70" rx="10" fill="#D82B78"/>
    <path d="M56 96c0-12 15-18 23-9 6-13 24-7 25 6 9 2 9 18-2 18H63c-9 0-12-11-7-15z" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="95" cy="102" r="8" fill="none" stroke="#fff" stroke-width="2"/><path d="M101 108l7 7" stroke="#fff" stroke-width="2"/>
    <text x="137" y="79" class="t h" font-size="16">Amazon CloudWatch</text>
    <text x="137" y="101" class="m small">API access logs</text>
    <text x="137" y="121" class="m small">Lambda execution logs</text>
  </g>

  <g transform="translate(450 355)">
    <rect width="300" height="170" rx="16" class="zone"/>
    <text x="150" y="32" text-anchor="middle" class="t h" font-size="18">Configuration &amp; Secrets</text>
    <rect x="42" y="54" width="70" height="70" rx="10" fill="#DD344C"/>
    <path d="M57 91h26v21H57zM61 91V80c0-11 18-11 18 0v11M89 80h10M89 89h10M89 98h10" fill="none" stroke="#fff" stroke-width="2.3"/>
    <text x="137" y="79" class="t h" font-size="16">AWS Secrets Manager</text>
    <text x="137" y="101" class="m small">Stores bearer token</text>
    <text x="137" y="121" class="m small">outside source and Terraform state</text>
  </g>

  <g transform="translate(785 355)">
    <rect width="420" height="170" rx="16" class="zone"/>
    <text x="210" y="32" text-anchor="middle" class="t h" font-size="18">Security &amp; Access Control</text>
    <rect x="42" y="54" width="70" height="70" rx="10" fill="#DD344C"/>
    <rect x="56" y="72" width="40" height="28" rx="3" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="69" cy="86" r="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M77 81h13M77 88h13M77 95h9" stroke="#fff" stroke-width="2"/>
    <text x="137" y="79" class="t h" font-size="16">AWS IAM</text>
    <text x="137" y="101" class="m small">Separate least-privilege roles</text>
    <text x="137" y="121" class="m small">Authorizer → one secret • Inference → one Bedrock model</text>
  </g>

  <path d="M315 195H335" class="line"/>
  <path d="M925 195H945" class="line"/>
  <path d="M150 320V355" class="dash"/>
  <path d="M485 320V355" class="dash"/>
  <path d="M630 320V355" class="dash"/>
  <path d="M1125 320V355" class="dash"/>
</g>

<path d="M215 355H265" class="line"/>

<g transform="translate(25 725)">
  <rect width="1545" height="120" rx="17" class="cloud"/>
  <text x="28" y="34" class="t h" font-size="18">Delivery / Infrastructure as Code</text>
  <circle cx="440" cy="63" r="30" fill="#151515"/><path d="M427 69c-4-13 4-22 13-22 11 0 18 9 15 22-3 9-8 13-15 13-6 0-11-4-13-13z" fill="#fff"/>
  <text x="485" y="58" class="t h" font-size="15">GitHub</text><text x="485" y="78" class="m small">Source repository</text>
  <path d="M610 63H665" class="line"/>
  <rect x="665" y="33" width="68" height="60" rx="9" fill="#0c4a87"/><circle cx="687" cy="53" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="712" cy="72" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M693 57l13 10" stroke="#fff" stroke-width="2"/>
  <text x="750" y="58" class="t h" font-size="15">GitHub Actions</text><text x="750" y="78" class="m small">Tests • Bandit • Terraform validation</text>
  <path d="M1010 63H1065" class="line"/>
  <rect x="1065" y="33" width="68" height="60" rx="9" fill="#6544C6"/><path d="M1081 46l16 7v16l-16-7zm18 8l16 7v16l-16-7zm0-16l16 7v15l-16-7z" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="1150" y="58" class="t h" font-size="15">Terraform</text><text x="1150" y="78" class="m small">Defines and manages the AWS stack</text>
  <text x="1450" y="58" text-anchor="end" class="m small">Deployment remains manual by design</text>
</g>

<text x="60" y="882" class="cap">SECURE</text><text x="440" y="882" class="cap">OBSERVABLE</text><text x="820" y="882" class="cap">SERVERLESS</text><text x="1260" y="882" class="cap">REPRODUCIBLE</text>
</svg>