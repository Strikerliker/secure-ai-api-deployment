<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API on AWS – AWS Architecture</title>
<desc id="desc">Layered AWS reference architecture showing clients outside the AWS boundary and grouped edge, identity, application, generative AI, data, security, observability, and delivery domains.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a30"/><stop offset="1" stop-color="#03111f"/></linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2945"/><stop offset="1" stop-color="#071b30"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".25"/></filter>
<style>.t{font-family:Arial,sans-serif;fill:#f7fbff}.m{font-family:Arial,sans-serif;fill:#b2cee1}.h{font-weight:700}.cloud{fill:#08223b;stroke:#2baaf5;stroke-width:2}.zone{fill:url(#p);stroke:#2b6f9d;stroke-width:1.5}.tiny{font-size:11px}.small{font-size:13px}.cap{font-size:13px;letter-spacing:2px;fill:#6ec1ff}.rel{stroke:#8abce0;stroke-width:2.2;fill:none}</style>
</defs>
<rect width="1600" height="900" rx="22" fill="url(#bg)"/>
<text x="800" y="48" text-anchor="middle" class="t h" font-size="39">Secure AI API on AWS – AWS Architecture</text>
<text x="800" y="80" text-anchor="middle" class="m" font-size="17">Production-style reference architecture with clear security, application, data, and operations domains</text>

<!-- Clients -->
<g transform="translate(25 180)">
 <rect width="180" height="360" rx="16" class="zone" filter="url(#sh)"/><text x="90" y="34" text-anchor="middle" class="t h" font-size="18">Clients</text>
 <rect x="30" y="72" width="120" height="95" rx="10" fill="#0a2742" stroke="#3977a5"/><path d="M55 130h70M66 92h48v30H66z" fill="none" stroke="#a9d5f5" stroke-width="3"/><text x="90" y="153" text-anchor="middle" class="t h" font-size="13">Web App</text>
 <rect x="30" y="190" width="120" height="95" rx="10" fill="#0a2742" stroke="#3977a5"/><rect x="75" y="208" width="30" height="52" rx="4" fill="none" stroke="#a9d5f5" stroke-width="3"/><text x="90" y="272" text-anchor="middle" class="t h" font-size="13">Mobile App</text>
</g>

<!-- AWS cloud -->
<rect x="225" y="120" width="1345" height="675" rx="20" class="cloud"/>
<text x="250" y="150" class="cap">AWS CLOUD • PRODUCTION ACCOUNT</text>

<!-- Top zones -->
<g transform="translate(255 185)">
 <rect width="400" height="280" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Edge &amp; Protection</text><text x="24" y="56" class="m small">Global access and threat protection</text>
 <g transform="translate(35 95)"><rect width="90" height="90" rx="11" fill="#17205a"/><rect x="18" y="16" width="54" height="54" rx="9" fill="#8C4FFF"/><path d="M45 28l16 8v16l-16 8-16-8V36z" fill="none" stroke="#fff" stroke-width="2.4"/><text x="45" y="51" text-anchor="middle" class="t h" font-size="13">53</text><text x="45" y="82" text-anchor="middle" class="t h" font-size="11">Route 53</text></g>
 <g transform="translate(155 95)"><rect width="90" height="90" rx="11" fill="#17205a"/><rect x="18" y="16" width="54" height="54" rx="9" fill="#8C4FFF"/><circle cx="45" cy="43" r="15" fill="none" stroke="#fff" stroke-width="2.3"/><path d="M30 43h30M45 28c7 7 7 23 0 30M45 28c-7 7-7 23 0 30" stroke="#fff" stroke-width="1.8"/><text x="45" y="82" text-anchor="middle" class="t h" font-size="11">CloudFront</text></g>
 <g transform="translate(275 95)"><rect width="90" height="90" rx="11" fill="#4a171d"/><rect x="18" y="16" width="54" height="54" rx="9" fill="#DD344C"/><circle cx="45" cy="43" r="15" fill="none" stroke="#fff" stroke-width="2.3"/><path d="M45 23v8M45 55v8M25 43h8M57 43h8" stroke="#fff" stroke-width="2"/><text x="45" y="82" text-anchor="middle" class="t h" font-size="11">AWS WAF</text></g>
</g>

<g transform="translate(675 185)">
 <rect width="340" height="280" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Identity &amp; API</text><text x="24" y="56" class="m small">Authentication and API management</text>
 <g transform="translate(45 95)"><rect width="110" height="100" rx="11" fill="#4a171d"/><rect x="27" y="16" width="56" height="56" rx="9" fill="#DD344C"/><rect x="38" y="31" width="34" height="25" rx="3" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="50" cy="43" r="4" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M58 38h9M58 45h9M58 52h7" stroke="#fff" stroke-width="1.8"/><text x="55" y="88" text-anchor="middle" class="t h" font-size="11">Amazon Cognito</text></g>
 <g transform="translate(185 95)"><rect width="110" height="100" rx="11" fill="#17205a"/><rect x="27" y="16" width="56" height="56" rx="9" fill="#8C4FFF"/><path d="M39 31h32v26H39zM47 37l-5 7 5 7M63 37l5 7-5 7M55 35v18" fill="none" stroke="#fff" stroke-width="2.2"/><text x="55" y="88" text-anchor="middle" class="t h" font-size="11">API Gateway</text></g>
</g>

<g transform="translate(1035 185)">
 <rect width="245" height="280" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Application Layer</text><text x="24" y="56" class="m small">Serverless compute</text>
 <g transform="translate(65 95)"><rect width="115" height="115" rx="12" fill="#3a250a"/><rect x="29" y="20" width="58" height="58" rx="9" fill="#FF9900"/><path d="M43 33h14l10 34H57l-5-16-7 16H35l12-26z" fill="none" stroke="#fff" stroke-width="2.7"/><text x="57" y="96" text-anchor="middle" class="t h" font-size="12">AWS Lambda</text></g>
</g>

<g transform="translate(1300 185)">
 <rect width="245" height="280" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Generative AI Services</text><text x="24" y="56" class="m small">Foundation models</text>
 <g transform="translate(65 95)"><rect width="115" height="115" rx="12" fill="#073038"/><rect x="29" y="20" width="58" height="58" rx="9" fill="#00A9A5"/><path d="M58 31c-9 0-15 7-15 16 0 5 3 10 7 13v9M58 31c9 0 15 7 15 16 0 5-3 10-7 13v9M50 45h16M50 53h16M58 31v38" fill="none" stroke="#fff" stroke-width="2.2"/><text x="57" y="96" text-anchor="middle" class="t h" font-size="12">Amazon Bedrock</text></g>
</g>

<!-- Lower zones -->
<g transform="translate(255 505)">
 <rect width="500" height="245" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Data &amp; Secrets</text><text x="24" y="56" class="m small">Persistent storage, configuration, and credentials</text>
 <g transform="translate(35 95)"><rect width="120" height="105" rx="11" fill="#18341e"/><rect x="32" y="14" width="56" height="56" rx="9" fill="#7AA116"/><ellipse cx="60" cy="31" rx="16" ry="5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M44 31v27c0 8 32 8 32 0V31" fill="none" stroke="#fff" stroke-width="2.4"/><text x="60" y="88" text-anchor="middle" class="t h" font-size="11">Amazon S3</text></g>
 <g transform="translate(190 95)"><rect width="120" height="105" rx="11" fill="#12274e"/><rect x="32" y="14" width="56" height="56" rx="9" fill="#2F6BD8"/><ellipse cx="60" cy="31" rx="16" ry="5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M44 31v27c0 8 32 8 32 0V31" fill="none" stroke="#fff" stroke-width="2.4"/><text x="60" y="88" text-anchor="middle" class="t h" font-size="11">DynamoDB</text></g>
 <g transform="translate(345 95)"><rect width="120" height="105" rx="11" fill="#4a171d"/><rect x="32" y="14" width="56" height="56" rx="9" fill="#DD344C"/><path d="M46 48h20V63H46zM50 48V40c0-8 12-8 12 0v8M70 40h8M70 47h8M70 54h8" fill="none" stroke="#fff" stroke-width="2"/><text x="60" y="88" text-anchor="middle" class="t h" font-size="10">Secrets Manager</text></g>
</g>

<g transform="translate(775 505)">
 <rect width="350" height="245" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Security &amp; Observability</text><text x="24" y="56" class="m small">Encryption, monitoring, and access control</text>
 <g transform="translate(40 95)"><rect width="115" height="105" rx="11" fill="#4a171d"/><rect x="29" y="14" width="56" height="56" rx="9" fill="#DD344C"/><path d="M43 48h20V63H43zM47 48V40c0-8 12-8 12 0v8" fill="none" stroke="#fff" stroke-width="2"/><text x="57" y="88" text-anchor="middle" class="t h" font-size="11">AWS KMS</text></g>
 <g transform="translate(195 95)"><rect width="115" height="105" rx="11" fill="#37172b"/><rect x="29" y="14" width="56" height="56" rx="9" fill="#D82B78"/><path d="M42 55c0-10 13-15 20-8 5-11 20-6 21 5 8 2 8 15-1 15H48c-8 0-11-9-6-12z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="74" cy="63" r="7" fill="none" stroke="#fff" stroke-width="1.8"/><text x="57" y="88" text-anchor="middle" class="t h" font-size="10">CloudWatch</text></g>
</g>

<g transform="translate(1145 505)">
 <rect width="400" height="245" rx="16" class="zone"/>
 <text x="24" y="34" class="t h" font-size="18">Delivery &amp; Operations</text><text x="24" y="56" class="m small">CI/CD and infrastructure as code</text>
 <g transform="translate(35 95)"><circle cx="45" cy="45" r="34" fill="#151515"/><path d="M32 51c-4-14 4-24 13-24 12 0 19 10 16 24-3 10-9 14-16 14-7 0-12-4-13-14z" fill="#fff"/><text x="45" y="95" text-anchor="middle" class="t h" font-size="11">GitHub</text></g>
 <g transform="translate(145 95)"><rect width="90" height="90" rx="11" fill="#0c4a87"/><circle cx="30" cy="36" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="60" cy="54" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M38 40l14 9" stroke="#fff" stroke-width="2"/><text x="45" y="82" text-anchor="middle" class="t h" font-size="10">GitHub Actions</text></g>
 <g transform="translate(270 95)"><rect width="90" height="90" rx="11" fill="#6544C6"/><path d="M28 28l17 8v18l-17-8zm19 9l17 8v18l-17-8zm0-18l17 8v17l-17-8z" fill="none" stroke="#fff" stroke-width="2.2"/><text x="45" y="82" text-anchor="middle" class="t h" font-size="10">Terraform</text></g>
</g>

