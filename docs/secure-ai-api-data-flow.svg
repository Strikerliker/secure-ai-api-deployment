<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API on AWS – Data Flow Diagram</title>
<desc id="desc">End-to-end request and response flow from clients through Route 53, CloudFront, WAF, Cognito, API Gateway, Lambda, Amazon Bedrock, and supporting S3, DynamoDB, Secrets Manager, CloudWatch, and KMS controls.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a30"/><stop offset="1" stop-color="#03111f"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".24"/></filter>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f74c9"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1da55b"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#082855}.w{font-family:Arial,sans-serif;fill:#fff}.h{font-weight:700}.m{font-family:Arial,sans-serif;fill:#426a96}.box{fill:#fff;stroke:#b9d8f5;stroke-width:1.5}.ln{stroke:#1f74c9;stroke-width:3;fill:none;marker-end:url(#a)}.ret{stroke:#1da55b;stroke-width:4;fill:none;marker-end:url(#g)}.dash{stroke:#3a70b0;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}.tiny{font-size:11px}.small{font-size:13px}</style>
</defs>
<rect width="1600" height="900" rx="22" fill="url(#bg)"/>
<text x="800" y="48" text-anchor="middle" class="w h" font-size="39">Secure AI API on AWS – Data Flow Diagram</text>
<text x="800" y="80" text-anchor="middle" class="w" font-size="17">End-to-end request and response flow for a secure Bedrock-powered API</text>
<rect x="25" y="120" width="1550" height="665" rx="18" fill="#f8fbff" stroke="#42aef5" stroke-width="2"/>

